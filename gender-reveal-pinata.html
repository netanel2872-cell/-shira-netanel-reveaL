<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf5e9" />
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="שירה ונתנאל מזמינים אתכם לגלות איתם הפתעה קטנה." />
  <meta property="og:title" content="ההפתעה של שירה ונתנאל" />
  <meta property="og:description" content="12 חבטות קטנות — והסוד בחוץ." />
  <title>הרגע של שירה ונתנאל</title>
  <style>
    :root {
      --paper: #fbf5e9;
      --paper-deep: #efe2cf;
      --ink: #15352f;
      --ink-soft: #5d706b;
      --mint: #9bcdb8;
      --mint-deep: #437965;
      --gold: #e6b94f;
      --lavender: #b9add6;
      --white: #fffefd;
      --shadow: 0 26px 70px rgba(31, 60, 52, .14);
      font-family: Arial, "Noto Sans Hebrew", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% 14%, rgba(155, 205, 184, .28) 0 112px, transparent 113px),
        radial-gradient(circle at 92% 82%, rgba(230, 185, 79, .18) 0 160px, transparent 161px),
        linear-gradient(145deg, #fffdf8 0%, var(--paper) 58%, #f8eddb 100%);
      transition: background .65s ease;
    }

    body.revealed {
      background: radial-gradient(circle at 50% 44%, #fff9fc 0 15%, #ffe3ef 48%, #ffcde0 100%);
    }

    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 4px solid rgba(230, 185, 79, .48); outline-offset: 5px; }

    .app-shell {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 32px));
      min-height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: max(18px, env(safe-area-inset-top)) 4px 10px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 900;
      letter-spacing: -.03em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50% 50% 46% 54%;
      background: var(--ink);
      color: var(--paper);
      transform: rotate(-7deg);
      box-shadow: 0 7px 0 rgba(21, 53, 47, .12);
    }

    .brand-mark span { transform: rotate(7deg); }

    .icon-button {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(21, 53, 47, .12);
      border-radius: 50%;
      background: rgba(255, 254, 253, .78);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(21, 53, 47, .08);
      transition: transform .18s ease, background .18s ease;
    }

    .icon-button:hover { transform: translateY(-2px); background: white; }
    .icon-button svg { width: 20px; height: 20px; fill: currentColor; }

    main { flex: 1; display: grid; align-items: center; padding: 18px 0 52px; }

    .game-layout {
      min-height: calc(100svh - 160px);
      display: grid;
      grid-template-columns: minmax(300px, .86fr) minmax(430px, 1.14fr);
      gap: clamp(28px, 5vw, 76px);
      align-items: center;
    }

    .game-copy { padding: 28px 0; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: var(--mint-deep);
      font-size: .86rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 18px;
      font-size: clamp(2.8rem, 6.5vw, 5.8rem);
      line-height: .98;
      letter-spacing: -.065em;
      font-weight: 900;
      text-wrap: balance;
    }

    h1 em {
      position: relative;
      color: var(--mint-deep);
      font-style: normal;
      white-space: nowrap;
    }

    h1 em::after {
      content: "";
      position: absolute;
      right: 2%;
      bottom: -.08em;
      width: 94%;
      height: .13em;
      border-radius: 50%;
      background: var(--gold);
      opacity: .65;
      transform: rotate(-1deg);
    }

    .lead {
      max-width: 510px;
      margin-bottom: 24px;
      color: var(--ink-soft);
      font-size: clamp(1.05rem, 2vw, 1.24rem);
      line-height: 1.65;
    }

    .instruction-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(21, 53, 47, .1);
      border-radius: 999px;
      background: rgba(255, 254, 253, .72);
      color: var(--ink-soft);
      font-size: .85rem;
      font-weight: 700;
    }

    .tap-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--gold);
      color: var(--ink);
      animation: tap-pulse 1.8s ease-in-out infinite;
    }

    @keyframes tap-pulse {
      0% { box-shadow: 0 0 0 0 rgba(230, 185, 79, .25); }
      50% { transform: scale(1.12); box-shadow: 0 0 0 8px rgba(230, 185, 79, 0); }
    }

    .game-stage {
      position: relative;
      min-height: min(630px, 74svh);
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(21, 53, 47, .09);
      border-radius: clamp(32px, 5vw, 58px);
      background:
        radial-gradient(circle at 50% 44%, rgba(255,255,255,.94) 0 31%, rgba(255,255,255,.36) 58%, transparent 72%),
        repeating-linear-gradient(135deg, transparent 0 27px, rgba(21,53,47,.025) 27px 29px),
        rgba(255,254,253,.52);
      box-shadow: inset 0 0 0 12px rgba(255,255,255,.22), var(--shadow);
      isolation: isolate;
      touch-action: manipulation;
    }

    .game-stage::before {
      content: "";
      position: absolute;
      top: -46%;
      left: 50%;
      width: 2px;
      height: 66%;
      background: repeating-linear-gradient(to bottom, var(--ink) 0 7px, transparent 7px 11px);
      opacity: .35;
      transform-origin: bottom center;
      animation: rope-sway 4.2s ease-in-out infinite;
    }

    @keyframes rope-sway { 50% { transform: rotate(1.5deg); } }

    .game-stage.stage-hit { animation: stage-rattle .36s cubic-bezier(.2,.8,.25,1); }
    @keyframes stage-rattle {
      0%, 100% { transform: translate(0,0); }
      22% { transform: translate(-7px, 3px) rotate(-.45deg); }
      48% { transform: translate(6px, -2px) rotate(.38deg); }
      72% { transform: translate(-3px, 1px) rotate(-.2deg); }
    }

    .corner-star {
      position: absolute;
      color: var(--gold);
      font-size: 1.4rem;
      opacity: .66;
      user-select: none;
    }

    .corner-star.one { top: 15%; right: 11%; transform: rotate(12deg); }
    .corner-star.two { bottom: 18%; left: 10%; color: var(--mint-deep); transform: rotate(-14deg) scale(.8); }
    .corner-star.three { top: 24%; left: 14%; color: var(--lavender); transform: scale(.6); }

    .watchers {
      position: absolute;
      z-index: 3;
      right: -1%;
      bottom: 11%;
      width: min(240px, 39%);
      pointer-events: none;
      transform-origin: 70% 100%;
      filter: drop-shadow(0 18px 14px rgba(21,53,47,.18));
    }

    .watchers img { width: 100%; height: auto; display: block; }
    .watchers.react { animation: watchers-react .46s cubic-bezier(.2,.86,.25,1.18); }
    .watchers.celebrate { animation: watchers-celebrate .85s cubic-bezier(.18,.8,.25,1.15); }

    @keyframes watchers-react {
      0%, 100% { transform: translateY(0) rotate(0); }
      38% { transform: translateY(-9px) rotate(2.2deg) scale(1.025); }
      67% { transform: translateY(2px) rotate(-1deg); }
    }

    @keyframes watchers-celebrate {
      0%, 100% { transform: translateY(0) rotate(0) scale(1); }
      28% { transform: translateY(-18px) rotate(3deg) scale(1.06); }
      54% { transform: translateY(1px) rotate(-2deg) scale(1.02); }
      76% { transform: translateY(-8px) rotate(1deg) scale(1.035); }
    }

    .pinata-button {
      position: relative;
      z-index: 4;
      width: min(410px, 78%);
      aspect-ratio: 1 / 1.15;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      filter: drop-shadow(0 26px 20px rgba(21,53,47,.17));
    }

    .pinata-button:disabled { cursor: default; }
    .pinata-button:not(:disabled):active .pinata-visual { transform: scale(.965); }

    .pinata-visual {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      transform-origin: 50% 8%;
    }

    .pinata-visual img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      filter: brightness(var(--brightness, 1)) contrast(var(--contrast, 1)) saturate(var(--saturation, 1));
      transform: rotate(var(--damage-tilt, 0deg)) scale(var(--damage-scale, 1));
      clip-path: var(--damage-clip, polygon(0 0, 100% 0, 100% 100%, 0 100%));
      transition: filter .22s ease, transform .22s ease, clip-path .22s ease;
    }

    .pinata-fallback { display: none; font-size: clamp(9rem, 28vw, 17rem); line-height: 1; transform: scaleX(-1); }
    .pinata-button.fallback .pinata-fallback { display: block; }
    .pinata-button.fallback img { display: none; }

    .pinata-button.hit-left .pinata-visual { animation: horse-hit-left .62s cubic-bezier(.16,.9,.28,1.18); }
    .pinata-button.hit-right .pinata-visual { animation: horse-hit-right .62s cubic-bezier(.16,.9,.28,1.18); }

    @keyframes horse-hit-left {
      0% { transform: rotate(0) scale(1); }
      14% { transform: rotate(8deg) translate(16px, -7px) scale(1.04); }
      38% { transform: rotate(-34deg) translate(-62px, 26px) scale(.82, 1.08); }
      64% { transform: rotate(22deg) translate(40px, -14px) scale(1.13, .9); }
      82% { transform: rotate(-11deg) translate(-20px, 6px) scale(.96, 1.06); }
      100% { transform: rotate(0) scale(1); }
    }

    @keyframes horse-hit-right {
      0% { transform: rotate(0) scale(1); }
      14% { transform: rotate(-8deg) translate(-16px, -7px) scale(1.04); }
      38% { transform: rotate(34deg) translate(62px, 26px) scale(.82, 1.08); }
      64% { transform: rotate(-22deg) translate(-40px, -14px) scale(1.13, .9); }
      82% { transform: rotate(11deg) translate(20px, 6px) scale(.96, 1.06); }
      100% { transform: rotate(0) scale(1); }
    }

    .damage-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .crack {
      position: absolute;
      width: 3px;
      height: var(--length, 42px);
      border-radius: 999px;
      background: linear-gradient(#584735, #2f2821);
      box-shadow: 1px 0 0 rgba(255,255,255,.55);
      opacity: 0;
      transform: rotate(var(--angle, 0deg)) scaleY(.2);
      transform-origin: top center;
      transition: opacity .2s ease, transform .24s cubic-bezier(.2,.9,.3,1.2);
    }

    .crack::before,
    .crack::after {
      content: "";
      position: absolute;
      top: 45%;
      width: 2px;
      height: 58%;
      border-radius: 999px;
      background: #403429;
      transform-origin: top;
    }

    .crack::before { left: -8px; transform: rotate(36deg); }
    .crack::after { right: -7px; transform: rotate(-31deg); }
    .crack.visible { opacity: var(--crack-opacity, .72); transform: rotate(var(--angle, 0deg)) scaleY(1); }

    .crack.c1 { top: 37%; left: 51%; --angle: 18deg; --length: 45px; }
    .crack.c2 { top: 47%; left: 62%; --angle: -20deg; --length: 52px; }
    .crack.c3 { top: 57%; left: 48%; --angle: 31deg; --length: 48px; }
    .crack.c4 { top: 31%; left: 60%; --angle: -38deg; --length: 39px; }
    .crack.c5 { top: 64%; left: 59%; --angle: 14deg; --length: 55px; }
    .crack.c6 { top: 48%; left: 42%; --angle: -12deg; --length: 43px; }
    .crack.c7 { top: 70%; left: 51%; --angle: -34deg; --length: 40px; }
    .crack.c8 { top: 33%; left: 44%; --angle: 48deg; --length: 62px; }
    .crack.c9 { top: 54%; left: 69%; --angle: -48deg; --length: 69px; }
    .crack.c10 { top: 63%; left: 36%; --angle: 23deg; --length: 72px; }
    .crack.c11 { top: 43%; left: 55%; --angle: -7deg; --length: 82px; }
    .crack.c12 { top: 73%; left: 69%; --angle: 42deg; --length: 59px; }

    .tear {
      position: absolute;
      width: var(--size, 34px);
      height: calc(var(--size, 34px) * .72);
      border: 3px solid rgba(83,67,49,.68);
      background: #d8c9af;
      opacity: 0;
      clip-path: polygon(4% 34%, 19% 8%, 42% 17%, 59% 0, 76% 22%, 100% 28%, 83% 54%, 94% 82%, 63% 74%, 43% 100%, 28% 75%, 0 70%);
      transform: scale(.25) rotate(var(--turn, 0deg));
      transition: opacity .22s ease, transform .28s cubic-bezier(.2,.9,.3,1.2);
      box-shadow: inset 0 0 0 4px rgba(74,58,40,.16), 0 2px 0 rgba(255,255,255,.45);
    }

    .tear.visible { opacity: .92; transform: scale(1) rotate(var(--turn, 0deg)); }
    .tear.t1 { top: 52%; left: 55%; --size: 31px; --turn: 12deg; }
    .tear.t2 { top: 61%; left: 45%; --size: 38px; --turn: -16deg; }
    .tear.t3 { top: 42%; left: 66%; --size: 29px; --turn: 24deg; }
    .tear.t4 { top: 70%; left: 61%; --size: 58px; --turn: -8deg; }
    .tear.t5 { top: 36%; left: 48%; --size: 47px; --turn: 19deg; }
    .tear.t6 { top: 57%; left: 70%; --size: 67px; --turn: -21deg; }

    .hammer {
      position: absolute;
      z-index: 9;
      top: 4%;
      right: 2%;
      width: 165px;
      height: 205px;
      opacity: 0;
      pointer-events: none;
      transform-origin: 78% 88%;
      filter: drop-shadow(0 13px 9px rgba(21,53,47,.25));
    }

    .hammer-handle {
      position: absolute;
      right: 68px;
      top: 47px;
      width: 21px;
      height: 150px;
      border: 2px solid #6d421c;
      border-radius: 11px;
      background: linear-gradient(90deg, #9a5d28, #d3944d 42%, #8b4f20 100%);
      transform: rotate(-28deg);
      transform-origin: top center;
      box-shadow: inset 4px 0 5px rgba(255,255,255,.25);
    }

    .hammer-head {
      position: absolute;
      right: 40px;
      top: 20px;
      width: 102px;
      height: 53px;
      border: 3px solid #303c3b;
      border-radius: 10px 15px 15px 10px;
      background: linear-gradient(180deg, #b7c0bd 0%, #667674 52%, #455452 100%);
      transform: rotate(-28deg);
      box-shadow: inset 0 8px 7px rgba(255,255,255,.32), inset 0 -6px 6px rgba(0,0,0,.18);
    }

    .hammer-head::before {
      content: "";
      position: absolute;
      left: -26px;
      top: 7px;
      width: 28px;
      height: 33px;
      border: 3px solid #303c3b;
      border-right: 0;
      border-radius: 12px 0 0 12px;
      background: linear-gradient(180deg, #aeb8b5, #53615f);
    }

    .hammer.swing { animation: hammer-smash .48s cubic-bezier(.16,.82,.27,1) both; }

    @keyframes hammer-smash {
      0% { opacity: 0; transform: translate(56px, -72px) rotate(-52deg) scale(.78); }
      15% { opacity: 1; }
      58% { opacity: 1; transform: translate(-88px, 118px) rotate(23deg) scale(1); }
      70% { opacity: 1; transform: translate(-78px, 105px) rotate(16deg) scale(.98); }
      100% { opacity: 0; transform: translate(-48px, 76px) rotate(-9deg) scale(.9); }
    }

    .impact-flash {
      position: absolute;
      z-index: 10;
      top: 42%;
      left: 51%;
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle, white 0 12%, var(--gold) 13% 37%, transparent 39%);
      color: var(--ink);
      font-size: 2.6rem;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.2) rotate(-20deg);
    }

    .impact-flash.show { animation: flash-pop .42s ease-out both; }

    @keyframes flash-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-20deg); }
      30% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(7deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.55) rotate(18deg); }
    }

    .impact-label {
      position: absolute;
      z-index: 11;
      top: 30%;
      left: 12%;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--ink);
      color: white;
      font-size: .85rem;
      font-weight: 900;
      pointer-events: none;
      opacity: 0;
      transform: rotate(-8deg) scale(.7);
    }

    .impact-label.show { animation: impact-pop .5s both; }

    @keyframes impact-pop {
      0% { opacity: 0; transform: rotate(-8deg) scale(.6); }
      30% { opacity: 1; transform: rotate(4deg) scale(1.08); }
      100% { opacity: 0; transform: rotate(-5deg) translateY(-22px) scale(.94); }
    }

    .debris-layer, .fragment-layer { position: absolute; z-index: 8; inset: 0; pointer-events: none; }
    .fragment-layer { z-index: 9; display: grid; place-items: center; }

    .paper-bit {
      position: absolute;
      top: 48%;
      left: 53%;
      width: var(--w, 10px);
      height: var(--h, 7px);
      border-radius: 2px;
      background: var(--bit-color, #eadbc2);
      opacity: 0;
      animation: debris-fly .72s cubic-bezier(.12,.66,.31,1) forwards;
    }

    @keyframes debris-fly {
      0% { opacity: 1; transform: translate(-50%,-50%) rotate(0) scale(1); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--spin)) scale(.55); }
    }

    .horse-fragment {
      position: absolute;
      width: min(410px, 78%);
      aspect-ratio: 1 / 1.15;
      object-fit: contain;
      filter: drop-shadow(0 18px 12px rgba(21,53,47,.2));
      animation: fragment-blast 1.05s cubic-bezier(.13,.7,.24,1) forwards;
    }

    @keyframes fragment-blast {
      0% { opacity: 1; transform: translate(0,0) rotate(0) scale(.93); }
      28% { opacity: 1; transform: translate(calc(var(--fx) * .25), calc(var(--fy) * .18)) rotate(calc(var(--fr) * .25)) scale(1.04); }
      100% { opacity: 0; transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(.45); filter: blur(4px); }
    }

    .progress-wrap {
      position: absolute;
      z-index: 12;
      right: 8%;
      bottom: 6%;
      left: 8%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 15px;
      border: 1px solid rgba(21,53,47,.1);
      border-radius: 16px;
      background: rgba(255,254,253,.82);
      backdrop-filter: blur(10px);
      transition: opacity .35s ease, transform .35s ease;
    }

    .progress-wrap.hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }
    .progress-copy { flex: 0 0 auto; min-width: 92px; color: var(--ink-soft); font-size: .78rem; font-weight: 900; }
    .progress-track { flex: 1; height: 8px; overflow: hidden; border-radius: 999px; background: var(--paper-deep); }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mint-deep), var(--gold)); transition: width .22s ease; }

    .pinata-button.burst .pinata-visual { animation: burst-away .7s cubic-bezier(.22,.8,.22,1) forwards; }

    @keyframes burst-away {
      0% { transform: scale(1) rotate(0); opacity: 1; filter: none; }
      35% { transform: scale(1.16) rotate(-5deg); opacity: 1; }
      100% { transform: scale(.12) rotate(34deg); opacity: 0; filter: blur(9px); }
    }

    .reveal-panel {
      position: absolute;
      z-index: 14;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      pointer-events: none;
      opacity: 0;
      transform: scale(.94);
      transition: opacity .48s ease, transform .48s cubic-bezier(.2,.85,.2,1.15);
    }

    .reveal-panel.visible { opacity: 1; transform: scale(1); pointer-events: auto; }

    .reveal-card {
      width: min(455px, 100%);
      padding: clamp(30px, 6vw, 56px) clamp(22px, 5vw, 44px);
      border: 2px solid #f39abd;
      border-radius: 34px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 34px 84px rgba(238,121,168,.26);
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .reveal-kicker { display: block; margin-bottom: 12px; color: #8d2951; font-size: .82rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .reveal-card h2 { margin: 0 0 12px; color: #8d2951; font-size: clamp(3.3rem, 11vw, 6.2rem); line-height: .96; letter-spacing: -.07em; }
    .reveal-card p { margin-bottom: 24px; color: #6f2946; font-size: 1.08rem; line-height: 1.55; }

    .replay-button {
      min-height: 50px;
      padding: 0 22px;
      border: 1.5px solid rgba(141,41,81,.2);
      border-radius: 15px;
      background: #fff5f9;
      color: #782443;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .replay-button:hover { transform: translateY(-2px); background: white; }

    .confetti-canvas { position: fixed; z-index: 40; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    .toast {
      position: fixed;
      z-index: 60;
      right: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      padding: 12px 17px;
      border-radius: 999px;
      background: var(--ink);
      color: white;
      font-size: .85rem;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(21,53,47,.24);
      opacity: 0;
      transform: translate(50%, 12px);
      transition: .25s ease;
      pointer-events: none;
    }

    .toast.visible { opacity: 1; transform: translate(50%, 0); }

    .runtime-notice {
      position: fixed;
      z-index: 100;
      right: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 14px;
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 18px;
      border: 2px solid rgba(141,41,81,.22);
      border-radius: 18px;
      background: #fff5f9;
      color: #6f2946;
      box-shadow: 0 18px 44px rgba(21,53,47,.2);
      font-size: .92rem;
      font-weight: 900;
      line-height: 1.45;
      text-align: center;
      pointer-events: none;
    }

    .game-ready .runtime-notice { display: none; }

    .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }

    @media (max-width: 860px) {
      .app-shell { width: min(100% - 24px, 700px); }
      .topbar { min-height: 70px; }
      main { align-items: start; padding-top: 8px; }
      .game-layout { min-height: auto; grid-template-columns: 1fr; gap: 20px; }
      .game-copy { padding: 18px 6px 0; text-align: center; }
      h1 { font-size: clamp(2.85rem, 13vw, 4.8rem); margin-bottom: 13px; }
      .lead { margin-right: auto; margin-left: auto; margin-bottom: 15px; }
      .game-stage { min-height: min(535px, 66svh); }
      .pinata-button { width: min(355px, 82%); }
      .hammer { right: -1%; top: 2%; transform: scale(.86); }
      @keyframes hammer-smash {
        0% { opacity: 0; transform: translate(38px,-62px) rotate(-52deg) scale(.7); }
        15% { opacity: 1; }
        58% { opacity: 1; transform: translate(-62px,102px) rotate(23deg) scale(.86); }
        70% { opacity: 1; transform: translate(-55px,92px) rotate(16deg) scale(.84); }
        100% { opacity: 0; transform: translate(-38px,70px) rotate(-9deg) scale(.75); }
      }
    }

    @media (max-width: 520px) {
      body { overscroll-behavior: none; }
      .app-shell { width: 100%; min-height: 100svh; padding: 0 6px; }
      .topbar {
        position: absolute;
        z-index: 30;
        top: max(8px, env(safe-area-inset-top));
        right: 10px;
        left: 10px;
        min-height: 42px;
        padding: 0;
        pointer-events: none;
      }
      .brand { display: none; }
      .icon-button { width: 40px; height: 40px; margin-right: auto; pointer-events: auto; }
      main { display: block; min-height: 100svh; padding: 0 0 max(6px, env(safe-area-inset-bottom)); }
      .game-layout {
        min-height: 100svh;
        height: 100svh;
        grid-template-rows: minmax(80px, auto) minmax(0, 1fr);
        gap: 6px;
      }
      .game-copy { min-height: 0; padding: max(12px, env(safe-area-inset-top)) 50px 0; align-self: center; }
      .game-copy .eyebrow { margin-bottom: 8px; font-size: .7rem; letter-spacing: .075em; }
      h1 { margin: 0; font-size: clamp(2rem, 10.5vw, 3rem); line-height: .96; }
      .game-stage { min-height: 0; height: 100%; border-radius: 25px; }
      .pinata-button { width: min(430px, 96%); transform: translateY(-26px); }
      .watchers { right: -6%; bottom: 12%; width: 41%; }
      .hammer { right: -5%; top: 0; transform: scale(.78); }
      .progress-wrap { right: 4%; bottom: 2.5%; left: 4%; }
      .progress-copy { min-width: 80px; font-size: .71rem; }
      .reveal-panel { padding: 14px; }
      .reveal-card { padding: 30px 20px; border-radius: 28px; }
      .impact-label { left: 6%; }
    }

    @media (max-width: 860px) and (orientation: landscape) {
      .app-shell { width: calc(100% - 12px); }
      .topbar { position: absolute; z-index: 30; right: 10px; left: 10px; min-height: 40px; pointer-events: none; }
      .topbar .brand { display: none; }
      .topbar .icon-button { width: 38px; height: 38px; margin-right: auto; pointer-events: auto; }
      main { padding: 4px 0; }
      .game-layout { min-height: calc(100svh - 8px); grid-template-columns: minmax(170px, .48fr) minmax(360px, 1.52fr); gap: 8px; }
      .game-copy { padding: 8px; }
      .game-copy .eyebrow { font-size: .68rem; }
      h1 { font-size: clamp(2rem, 5vw, 3.4rem); }
      .game-stage { min-height: calc(100svh - 8px); border-radius: 24px; }
      .pinata-button { width: min(390px, 68%); }
      .watchers { width: 30%; bottom: 10%; }
      .progress-wrap { bottom: 3%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

  <script>
    (() => {
      "use strict";

      const TOTAL_HITS = 12;
      const reducedMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      const impactWords = ["בום!", "טאק!", "קראק!", "עוד!", "זה נסדק!", "כמעט!"];
      const els = {
        confettiCanvas: document.getElementById("confettiCanvas"),
        soundButton: document.getElementById("soundButton"),
        soundOnIcon: document.getElementById("soundOnIcon"),
        soundOffIcon: document.getElementById("soundOffIcon"),
        hammer: document.getElementById("hammer"),
        impactFlash: document.getElementById("impactFlash"),
        impactLabel: document.getElementById("impactLabel"),
        gameStage: document.getElementById("gameStage"),
        watchers: document.getElementById("watchers"),
        debrisLayer: document.getElementById("debrisLayer"),
        fragmentLayer: document.getElementById("fragmentLayer"),
        pinataButton: document.getElementById("pinataButton"),
        pinataVisual: document.getElementById("pinataVisual"),
        pinataImage: document.getElementById("pinataImage"),
        progressWrap: document.getElementById("progressWrap"),
        progressCopy: document.getElementById("progressCopy"),
        progressTrack: document.getElementById("progressTrack"),
        progressFill: document.getElementById("progressFill"),
        revealPanel: document.getElementById("revealPanel"),
        revealTitle: document.getElementById("revealTitle"),
        replayButton: document.getElementById("replayButton"),
        toast: document.getElementById("toast"),
        liveStatus: document.getElementById("liveStatus")
      };

      let hits = 0;
      let busy = false;
      let revealed = false;
      let muted = false;
      let audioContext = null;
      let impactTimer = 0;
      let releaseTimer = 0;
      let revealTimer = 0;
      let panelTimer = 0;
      let toastTimer = 0;
      let confettiAnimation = 0;

      function ensureAudio() {
        if (muted || audioContext) return;
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (AudioCtor) {
          try { audioContext = new AudioCtor(); }
          catch (_) { audioContext = null; }
        }
      }

      function tone(frequency, duration, type = "triangle", volume = .03, delay = 0) {
        if (muted) return;
        ensureAudio();
        if (!audioContext) return;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const start = audioContext.currentTime + delay;
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + .03);
      }

      function playImpact(progress) {
        tone(108 + progress * 85, .1, "triangle", .032);
        tone(67, .08, "sine", .02, .014);
        if (progress > .72) tone(210 + progress * 100, .07, "square", .012, .04);
      }

      function playReveal() {
        [392, 523.25, 659.25, 783.99].forEach((note, index) => tone(note, .68, "sine", .035, index * .1));
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add("visible");
        toastTimer = window.setTimeout(() => els.toast.classList.remove("visible"), 1900);
      }

      els.soundButton.addEventListener("click", () => {
        muted = !muted;
        els.soundOnIcon.hidden = muted;
        els.soundOffIcon.hidden = !muted;
        els.soundButton.setAttribute("aria-label", muted ? "הפעלת צלילים" : "השתקת צלילים");
        showToast(muted ? "הצלילים הושתקו" : "הצלילים הופעלו");
      });

      function restartAnimation(element, className) {
        element.classList.remove(className);
        void element.offsetWidth;
        element.classList.add(className);
      }

      function spawnDebris(progress) {
        const palette = ["#ff4fa3", "#ff9ac8", "#26aef2", "#8bd8ff", "#e6b94f"];
        const count = 16 + Math.round(progress * 10);
        for (let i = 0; i < count; i += 1) {
          const bit = document.createElement("i");
          bit.className = "paper-bit";
          const angle = Math.PI * 2 * (i / count) + (Math.random() - .5) * .55;
          const distance = 85 + Math.random() * (100 + progress * 95);
          bit.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
          bit.style.setProperty("--dy", `${Math.sin(angle) * distance + 30}px`);
          bit.style.setProperty("--spin", `${Math.round(Math.random() * 540 - 270)}deg`);
          bit.style.setProperty("--w", `${7 + Math.random() * 15}px`);
          bit.style.setProperty("--h", `${5 + Math.random() * 12}px`);
          bit.style.setProperty("--bit-color", palette[i % palette.length]);
          bit.style.animationDelay = `${Math.random() * .04}s`;
          els.debrisLayer.appendChild(bit);
          window.setTimeout(() => bit.remove(), 850);
        }
      }

      function applyDamage() {
        const progress = hits / TOTAL_HITS;
        const tilt = hits % 2 ? -progress * 7 : progress * 7;
        els.pinataVisual.style.setProperty("--brightness", String(1 - progress * .26));
        els.pinataVisual.style.setProperty("--contrast", String(1 + progress * .28));
        els.pinataVisual.style.setProperty("--saturation", String(1 - progress * .32));
        els.pinataVisual.style.setProperty("--damage-scale", String(1 - progress * .11));
        els.pinataVisual.style.setProperty("--damage-tilt", `${tilt}deg`);
        if (hits >= 3 && hits < 6) {
          els.pinataVisual.style.setProperty("--damage-clip", "polygon(0 0,100% 0,100% 43%,94% 48%,100% 54%,100% 100%,0 100%,0 74%,7% 67%,0 59%)");
        } else if (hits >= 6 && hits < 9) {
          els.pinataVisual.style.setProperty("--damage-clip", "polygon(3% 0,97% 0,100% 34%,91% 41%,100% 50%,92% 58%,100% 67%,96% 100%,5% 100%,0 78%,9% 69%,0 59%,7% 49%,0 38%)");
        } else if (hits >= 9) {
          els.pinataVisual.style.setProperty("--damage-clip", "polygon(7% 0,94% 0,100% 25%,87% 34%,100% 44%,86% 53%,100% 63%,89% 72%,96% 100%,13% 100%,0 86%,13% 74%,0 64%,12% 53%,0 42%,14% 31%)");
        }

        document.querySelectorAll("[data-at]").forEach((mark) => {
          const threshold = Number(mark.dataset.at);
          const visible = hits >= threshold;
          mark.classList.toggle("visible", visible);
          if (visible && mark.classList.contains("crack")) {
            mark.style.setProperty("--crack-opacity", String(Math.min(.95, .5 + (hits - threshold) * .08)));
          }
        });
      }

      function progressMessage(remaining) {
        if (remaining === 1) return "נשארה חבטה אחת!";
        if (remaining === 2) return "עוד שתי חבטות";
        if (hits >= 9) return "הפיניאטה כמעט מתפרקת";
        if (hits >= 6) return "הסדקים מעמיקים";
        if (hits >= 3) return "כבר רואים סדקים";
        return "הפטיש התחיל לעבוד";
      }

      function registerImpact() {
        if (revealed) return;
        hits += 1;
        const progress = hits / TOTAL_HITS;
        const remaining = TOTAL_HITS - hits;

        restartAnimation(els.impactFlash, "show");
        if (progress > .42) restartAnimation(els.gameStage, "stage-hit");
        restartAnimation(els.watchers, "react");
        els.impactLabel.textContent = impactWords[Math.min(impactWords.length - 1, Math.floor(progress * impactWords.length))];
        restartAnimation(els.impactLabel, "show");
        els.pinataButton.classList.remove("hit-left", "hit-right");
        void els.pinataButton.offsetWidth;
        els.pinataButton.classList.add(hits % 2 ? "hit-left" : "hit-right");
        applyDamage();
        spawnDebris(progress);
        playImpact(progress);
        if (!reducedMotion && navigator.vibrate) navigator.vibrate(progress > .75 ? 38 : 20);

        els.progressFill.style.width = `${Math.round(progress * 100)}%`;
        els.progressTrack.setAttribute("aria-valuenow", String(Math.round(progress * 100)));
        els.progressCopy.textContent = `${hits} מתוך ${TOTAL_HITS}`;
        els.pinataButton.setAttribute("aria-label", remaining ? `חבטה בפיניאטה, נשארו ${remaining} חבטות` : "הפיניאטה נפתחת");
        els.liveStatus.textContent = remaining ? progressMessage(remaining) : "הפיניאטה נשברת ונפתחת";

        if (remaining === 0) {
          revealed = true;
          els.pinataButton.disabled = true;
          revealTimer = window.setTimeout(reveal, reducedMotion ? 40 : 470);
        }
      }

      function hitPinata() {
        if (busy || revealed) return;
        busy = true;
        ensureAudio();
        restartAnimation(els.hammer, "swing");
        impactTimer = window.setTimeout(registerImpact, reducedMotion ? 10 : 125);
        releaseTimer = window.setTimeout(() => { busy = false; }, reducedMotion ? 30 : 235);
      }

      let lastTouchAt = 0;

      function isGameControl(target) {
        let element = target;
        if (element && element.nodeType !== 1) element = element.parentElement;
        if (!element || typeof element.closest !== "function") return false;
        return Boolean(element.closest("#soundButton, #replayButton"));
      }

      function canHitFrom(target) {
        return !isGameControl(target) && !els.revealPanel.classList.contains("visible");
      }

      function registerScreenTap(event) {
        if (!canHitFrom(event.target)) return;
        if (event.cancelable) event.preventDefault();
        lastTouchAt = Date.now();
        hitPinata();
      }

      document.addEventListener("touchend", registerScreenTap, { passive: false, capture: true });
      document.addEventListener("pointerup", (event) => {
        if (event.pointerType !== "touch" && event.pointerType !== "pen") return;
        if (Date.now() - lastTouchAt < 700 || !canHitFrom(event.target)) return;
        lastTouchAt = Date.now();
        hitPinata();
      }, true);
      document.addEventListener("click", (event) => {
        if (Date.now() - lastTouchAt < 700 || !canHitFrom(event.target)) return;
        hitPinata();
      }, true);
      els.pinataImage.addEventListener("error", () => els.pinataButton.classList.add("fallback"));
      document.documentElement.classList.add("game-ready");

      function startConfetti() {
        if (reducedMotion) return;
        const canvas = els.confettiCanvas;
        const context = canvas.getContext("2d");
        if (!context) return;
        cancelAnimationFrame(confettiAnimation);
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * ratio;
        canvas.height = window.innerHeight * ratio;
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        context.setTransform(ratio,0,0,ratio,0,0);
        const palette = ["#ee79a8", "#ffb7d2", "#ffffff", "#e6b94f", "#ff8dba"];
        const pieces = Array.from({ length: Math.min(320, Math.round(window.innerWidth / 2.4)) }, (_, index) => ({
          x: window.innerWidth * (.2 + Math.random() * .6), y: window.innerHeight * .45,
          vx: (Math.random() - .5) * 15, vy: -(Math.random() * 13 + 5), gravity: .17 + Math.random() * .12,
          rotation: Math.random() * Math.PI, spin: (Math.random() - .5) * .25,
          width: 6 + Math.random() * 8, height: 5 + Math.random() * 7, color: palette[index % palette.length], life: 1
        }));
        const fireworkPalette = ["#ff1684", "#ff3f9a", "#ff6fb5", "#ff98ca", "#ffc2dc", "#ffe4ef", "#ffffff", "#e6b94f"];
        const isSmallScreen = window.innerWidth < 600;
        const burstCount = isSmallScreen ? 14 : 18;
        const sparksPerBurst = isSmallScreen ? 52 : 64;
        const bursts = Array.from({ length: burstCount }, (_, burstIndex) => {
          const centerX = window.innerWidth * (.07 + Math.random() * .86);
          const centerY = window.innerHeight * (.07 + Math.random() * .48);
          const delay = burstIndex * 240 + Math.random() * 140;
          const sparks = Array.from({ length: sparksPerBurst }, (_, sparkIndex) => {
            const angle = Math.PI * 2 * (sparkIndex / sparksPerBurst) + (Math.random() - .5) * .18;
            const speed = 4.2 + Math.random() * 5.2;
            return {
              x: centerX, y: centerY, px: centerX, py: centerY,
              vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
              delay, age: 0, maxAge: 75 + Math.random() * 40,
              color: fireworkPalette[(sparkIndex + burstIndex) % fireworkPalette.length],
              size: 1.8 + Math.random() * 3.4
            };
          });
          return { centerX, centerY, delay, sparks };
        });
        const fireworks = bursts.flatMap((burst) => burst.sparks);
        const started = performance.now();
        const draw = (now) => {
          const elapsed = now - started;
          context.clearRect(0,0,window.innerWidth,window.innerHeight);
          pieces.forEach((piece) => {
            piece.vy += piece.gravity; piece.x += piece.vx; piece.y += piece.vy; piece.rotation += piece.spin;
            if (now - started > 3600) piece.life -= .009;
            context.save(); context.globalAlpha = Math.max(0,piece.life); context.translate(piece.x,piece.y); context.rotate(piece.rotation);
            context.fillStyle = piece.color; context.fillRect(-piece.width/2,-piece.height/2,piece.width,piece.height); context.restore();
          });
          context.save();
          context.globalCompositeOperation = "lighter";
          bursts.forEach((burst) => {
            const bloomAge = elapsed - burst.delay;
            if (bloomAge < 0 || bloomAge > 360) return;
            const bloom = Math.sin((bloomAge / 360) * Math.PI);
            context.globalAlpha = bloom * .95;
            context.fillStyle = "#fff3f9";
            context.shadowBlur = 28;
            context.shadowColor = "#ff3f9a";
            context.beginPath();
            context.arc(burst.centerX, burst.centerY, 5 + bloom * 22, 0, Math.PI * 2);
            context.fill();
          });
          context.shadowBlur = isSmallScreen ? 10 : 15;
          fireworks.forEach((spark) => {
            if (elapsed < spark.delay || spark.age >= spark.maxAge) return;
            spark.px = spark.x; spark.py = spark.y;
            spark.vx *= .982; spark.vy = spark.vy * .982 + .03;
            spark.x += spark.vx; spark.y += spark.vy; spark.age += 1;
            const life = Math.max(0, 1 - spark.age / spark.maxAge);
            context.globalAlpha = life;
            context.strokeStyle = spark.color;
            context.shadowColor = spark.color;
            context.lineWidth = spark.size * life + .7;
            context.beginPath(); context.moveTo(spark.px, spark.py); context.lineTo(spark.x, spark.y); context.stroke();
            context.fillStyle = spark.color;
            context.beginPath(); context.arc(spark.x, spark.y, spark.size * life + .5, 0, Math.PI * 2); context.fill();
          });
          context.restore();
          const fireworksAlive = fireworks.some((spark) => elapsed < spark.delay || spark.age < spark.maxAge);
          if (elapsed < 7800 && (pieces.some((piece) => piece.life > 0 && piece.y < window.innerHeight + 40) || fireworksAlive)) confettiAnimation = requestAnimationFrame(draw);
          else context.clearRect(0,0,window.innerWidth,window.innerHeight);
        };
        confettiAnimation = requestAnimationFrame(draw);
      }

      function launchHorseFragments() {
        const fragments = [
          { clip: "polygon(0 0,55% 0,48% 48%,0 58%)", x: "-185px", y: "-150px", r: "-42deg" },
          { clip: "polygon(55% 0,100% 0,100% 52%,48% 48%)", x: "190px", y: "-135px", r: "38deg" },
          { clip: "polygon(0 58%,48% 48%,54% 100%,0 100%)", x: "-205px", y: "165px", r: "-55deg" },
          { clip: "polygon(48% 48%,100% 52%,100% 100%,54% 100%)", x: "210px", y: "175px", r: "61deg" }
        ];
        els.fragmentLayer.innerHTML = "";
        fragments.forEach((part, index) => {
          const img = document.createElement("img");
          img.className = "horse-fragment";
          img.alt = "";
          img.src = els.pinataImage.src;
          img.style.clipPath = part.clip;
          img.style.setProperty("--fx", part.x);
          img.style.setProperty("--fy", part.y);
          img.style.setProperty("--fr", part.r);
          img.style.animationDelay = `${index * .025}s`;
          els.fragmentLayer.appendChild(img);
        });
      }

      function reveal() {
        document.body.classList.add("revealed");
        els.watchers.classList.remove("react");
        restartAnimation(els.watchers, "celebrate");
        launchHorseFragments();
        els.pinataButton.classList.add("burst");
        els.progressWrap.classList.add("hidden");
        playReveal();
        startConfetti();
        if (!reducedMotion && navigator.vibrate) navigator.vibrate([70,35,110]);
        document.title = "זו בת! | שירה ונתנאל";
        panelTimer = window.setTimeout(() => {
          els.revealPanel.classList.add("visible");
          els.revealPanel.setAttribute("aria-hidden", "false");
          els.replayButton.disabled = false;
          els.liveStatus.setAttribute("aria-live", "assertive");
          els.liveStatus.textContent = "זו בת! שירה ונתנאל מתרגשים לחלוק איתכם את הרגע הזה.";
          els.revealTitle.focus({ preventScroll: true });
        }, reducedMotion ? 40 : 520);
      }

      function resetGame() {
        hits = 0; busy = false; revealed = false;
        [impactTimer,releaseTimer,revealTimer,panelTimer].forEach(clearTimeout);
        cancelAnimationFrame(confettiAnimation);
        const context = els.confettiCanvas.getContext("2d");
        if (context) context.clearRect(0,0,els.confettiCanvas.width,els.confettiCanvas.height);
        document.body.classList.remove("revealed");
        document.title = "הרגע של שירה ונתנאל";
        els.pinataButton.disabled = false;
        els.pinataButton.classList.remove("burst","hit-left","hit-right");
        els.pinataButton.setAttribute("aria-label", "חבטה בפיניאטה, נשארו 12 חבטות");
        els.pinataVisual.removeAttribute("style");
        document.querySelectorAll("[data-at]").forEach((mark) => { mark.classList.remove("visible"); mark.style.removeProperty("--crack-opacity"); });
        els.debrisLayer.innerHTML = "";
        els.fragmentLayer.innerHTML = "";
        els.gameStage.classList.remove("stage-hit");
        els.watchers.classList.remove("react", "celebrate");
        els.progressFill.style.width = "0%";
        els.progressTrack.setAttribute("aria-valuenow", "0");
        els.progressCopy.textContent = "0 מתוך 12";
        els.progressWrap.classList.remove("hidden");
        els.revealPanel.classList.remove("visible");
        els.revealPanel.setAttribute("aria-hidden", "true");
        els.replayButton.disabled = true;
        els.liveStatus.setAttribute("aria-live", "polite");
        els.liveStatus.textContent = "הפיניאטה מוכנה לסיבוב נוסף";
        els.pinataButton.focus({ preventScroll: true });
      }

      els.replayButton.addEventListener("click", resetGame);
    })();
  </script>
</body>
</html>
